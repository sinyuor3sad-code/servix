;; PgBouncer config — SERVIX Production
;; Wildcard (*) allows dynamic tenant databases (e.g. servix_tenant_xxx)

[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
;; V-28: auth_query routes through a SECURITY DEFINER function so the role
;; pgbouncer uses (auth_user, below) does not need SUPERUSER. The function
;; itself runs as the schema owner (servix) and reads pg_shadow on the
;; caller's behalf — same data exposure as the original auth_query, but the
;; credential at rest in userlist.txt is a role that can ONLY call this one
;; function. Replaces the A8-IV-025 superuser delegation.
;;
;; auth_dbname forces every auth_query call to run against `postgres` (where
;; the pgbouncer schema lives) regardless of which DB the client requested —
;; otherwise multi-tenant clients hit "schema pgbouncer does not exist" on
;; their tenant DB.
auth_query = SELECT * FROM pgbouncer.user_lookup($1)
auth_user = pgbouncer_auth
auth_dbname = postgres

;; A8-IV-037: pgbouncer→postgres hop (server side).
server_tls_sslmode = require

;; A8-IV-042: api→pgbouncer hop (client side). pgbouncer presents the leaf
;; cert minted by /etc/servix/pgbouncer-ca/ (signed by an internal Servix CA).
;; Clients negotiate via api `sslmode=verify-ca` + `sslrootcert=/etc/servix/ssl/ca.crt`.
client_tls_sslmode    = require
client_tls_cert_file  = /etc/pgbouncer/tls/pgbouncer.crt
client_tls_key_file   = /etc/pgbouncer/tls/pgbouncer.key
client_tls_protocols  = secure

pool_mode = transaction
default_pool_size = 50
min_pool_size = 5
max_client_conn = 300
max_db_connections = 150
reserve_pool_size = 5
reserve_pool_timeout = 3
server_idle_timeout = 300
query_timeout = 30

ignore_startup_parameters = extra_float_digits

;; Logging
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60
