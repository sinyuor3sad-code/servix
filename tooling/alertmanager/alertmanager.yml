# ═════════════════════════════════════════════════════════════════
# SERVIX Alertmanager configuration
#
# Receivers are driven by env vars so we can rotate webhooks without
# rebuilding the image. Set these in tooling/docker/.env (rendered by
# the `alertmanager-config` init container via envsubst):
#
#   # Primary on-call channel (A8-IV-043, 2026-05-18):
#   ALERT_TELEGRAM_BOT_TOKEN      # bot token from @BotFather
#   ALERT_TELEGRAM_CHAT_ID        # numeric chat ID (positive=user, negative=group)
#
#   # Optional — only used if set; otherwise the alertmanager-config init
#   # container substitutes .invalid placeholders so AM still starts:
#   ALERT_SLACK_WEBHOOK_URL       # Slack incoming webhook
#   ALERT_PAGERDUTY_ROUTING_KEY   # PagerDuty Events API v2 routing key
#   ALERT_EMAIL_TO                # On-call email
#   ALERT_EMAIL_FROM              # SMTP FROM address
#   ALERT_SMTP_HOST, _USER, _PASS # SMTP credentials
# ═════════════════════════════════════════════════════════════════

global:
  resolve_timeout: 5m
  telegram_api_url: 'https://api.telegram.org'
  smtp_from: '${ALERT_EMAIL_FROM}'
  smtp_smarthost: '${ALERT_SMTP_HOST}'
  smtp_auth_username: '${ALERT_SMTP_USER}'
  smtp_auth_password: '${ALERT_SMTP_PASS}'
  smtp_require_tls: true

templates:
  - '/etc/alertmanager/templates/*.tmpl'

# A8-IV-043: routing tree now centred on Telegram (the actual on-call
# channel for this deployment). Slack/PagerDuty/email blocks remain so
# they can be enabled later by just setting their env vars; until then
# the init container fills them with .invalid placeholders that DNS-fail
# silently — alertmanager itself stays healthy.
route:
  receiver: 'telegram-default'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Critical — fan-out to every configured channel for redundancy.
    - matchers:
        - severity = P1
      receiver: 'critical-multi'
      group_wait: 10s
      repeat_interval: 1h
      continue: false

    # Warnings — Telegram only.
    - matchers:
        - severity = P2
      receiver: 'telegram-default'
      repeat_interval: 6h

    # Low priority / noise — batched digest.
    - matchers:
        - severity =~ "P3|P4|info"
      receiver: 'telegram-digest'
      group_interval: 30m
      repeat_interval: 24h

# Silence warning-level alerts when a P1 for the same service is firing.
inhibit_rules:
  - source_matchers:
      - severity = P1
    target_matchers:
      - severity =~ "P2|P3"
    equal: ['alertname', 'cluster', 'service']

receivers:
  # ── Telegram (primary, A8-IV-043) ──
  - name: 'telegram-default'
    telegram_configs:
      - bot_token: '${ALERT_TELEGRAM_BOT_TOKEN}'
        chat_id: ${ALERT_TELEGRAM_CHAT_ID}
        parse_mode: 'HTML'
        send_resolved: true
        message: |
          <b>[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}</b>
          {{ range .Alerts }}
          <b>Severity:</b> {{ .Labels.severity }}
          <b>Service:</b> {{ if .Labels.service }}{{ .Labels.service }}{{ else }}n/a{{ end }}
          <b>Summary:</b> {{ .Annotations.summary }}
          {{- if .Annotations.description }}
          <b>Description:</b> {{ .Annotations.description }}
          {{- end }}
          <b>Started:</b> {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}
          {{- end }}

  - name: 'telegram-digest'
    telegram_configs:
      - bot_token: '${ALERT_TELEGRAM_BOT_TOKEN}'
        chat_id: ${ALERT_TELEGRAM_CHAT_ID}
        parse_mode: 'HTML'
        send_resolved: false
        message: |
          <i>[DIGEST] {{ .CommonLabels.alertname }}</i> — {{ .Alerts | len }} alert(s)

  # ── Critical fan-out: Telegram + Slack + PagerDuty + Email ──
  - name: 'critical-multi'
    telegram_configs:
      - bot_token: '${ALERT_TELEGRAM_BOT_TOKEN}'
        chat_id: ${ALERT_TELEGRAM_CHAT_ID}
        parse_mode: 'HTML'
        send_resolved: true
        message: |
          🔴 <b>P1 [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}</b>
          {{ range .Alerts }}
          <b>Summary:</b> {{ .Annotations.summary }}
          {{- if .Annotations.description }}
          <b>Description:</b> {{ .Annotations.description }}
          {{- end }}
          <b>Runbook:</b> https://grafana.servix.io/d/runbooks
          {{- end }}
    slack_configs:
      - api_url: '${ALERT_SLACK_WEBHOOK_URL}'
        channel: '#servix-incidents'
        send_resolved: true
        title: '🔴 P1 [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Runbook:* https://grafana.servix.io/d/runbooks
          {{ end }}
    pagerduty_configs:
      - routing_key: '${ALERT_PAGERDUTY_ROUTING_KEY}'
        send_resolved: true
        description: '{{ .CommonLabels.alertname }}: {{ .CommonAnnotations.summary }}'
        severity: 'critical'
        client: 'SERVIX Alertmanager'
        client_url: 'https://grafana.servix.io/alerting/list'
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        send_resolved: true
        headers:
          Subject: '🔴 [P1] SERVIX: {{ .CommonLabels.alertname }}'
